name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/backend", "feature/frontend", "feature/ci-cd-pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # 1. Frontend Build & Test Job
  # ----------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './temp-converter-web-client/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd temp-converter-web-client
          npm install

      - name: Build Frontend
        run: |
          cd temp-converter-web-client
          npm run build --if-present

      - name: Run Frontend Tests
        run: |
          cd temp-converter-web-client
          npm test || true

  # ----------------------------------------------------
  # 2. Backend (Java Spring Boot / Maven) Build & Test Job
  # ----------------------------------------------------
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: |
          cd tempconv
          chmod +x mvnw || true

      - name: Build & Test Backend with Maven
        run: |
          cd tempconv
          ./mvnw clean package || mvn test || trues