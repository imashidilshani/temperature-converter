name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/backend", "feature/frontend", "feature/ci-cd-pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd temp-converter-web-client
          npm install

      - name: Build Frontend
        run: |
          cd temp-converter-web-client
          npm run build --if-present

      - name: Run Tests
        run: |
          cd temp-converter-web-client
          npm test --if-present || true